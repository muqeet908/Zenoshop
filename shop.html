<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZENOTM PRODUCTS</title>

<style>
body {
    background: linear-gradient(120deg,#020024,#090979,#000);
    color: white;
    font-family: Arial;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 40px;
    text-shadow: 0 0 10px cyan;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.card {
    background: #111;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,255,255,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px cyan;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

button {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #00f0ff, #00aaff);
    border: none;
    color: black;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

.buttons {
    display: none;
    margin-top: 10px;
}

.buttons a {
    display: block;
    text-decoration: none;
    color: white;
    background: #111;
    padding: 8px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid cyan;
}
</style>
</head>

<body>

<h1>🔥 ZENOTM PREMIUM PRODUCTS 🔥</h1>

<div class="grid">

<script>
const products = [
  "Cinematic Pack", "Reels Bundle", "Vlog Presets", "Transition Pack",
  "Color LUTs", "Shake Effects", "Text Animations", "Instagram Pack",
  "YouTube Kit", "Motion Pack", "Light Leaks", "Mega Bundle"
];

products.forEach(p => {
document.write(`
<div class="card">
    <img src="https://picsum.photos/300/200?random=${Math.random()}">
    <h3>${p}</h3>
    <p>Price: Rs 499</p>
    <button onclick="showButtons(this)">Buy Now</button>
    <div class="buttons">
        <a href="https://wa.me/923481689189" target="_blank">Contact on WhatsApp</a>
        <a href="https://t.me/ZenoEditzTM" target="_blank">Contact on Telegram</a>
    </div>
</div>
`);
});

function showButtons(btn) {
    btn.nextElementSibling.style.display = "block";
}
</script>

</div>

</body>
</html>
