<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZENOTM PRODUCTS</title>
<style>
body {
    background: linear-gradient(120deg, #020024, #090979, #000);
    background-size: 400% 400%;
    animation: bg 15s ease infinite;
    color: white;
    font-family: Arial;
    margin: 0;
    padding: 20px;
}

@keyframes bg {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

h1 {
    text-align: center;
    margin-bottom: 40px;
    text-shadow: 0 0 15px cyan;
}

.product {
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 25px;
    box-shadow: 0 0 20px rgba(0,255,255,0.3);
    transform: translateY(40px);
    opacity: 0;
    transition: 0.8s;
}

.product.show {
    transform: translateY(0);
    opacity: 1;
}

.product img {
    width: 100%;
    border-radius: 12px;
}

.price {
    margin-top: 10px;
    font-size: 18px;
    color: #00ffee;
}

button {
    margin-top: 10px;
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #00eaff, #008cff);
    border: none;
    color: black;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<h1>🔥 PREMIUM PRODUCTS 🔥</h1>

<div class="product">
    <img src="https://picsum.photos/500/300?1">
    <h3>Premium Transitions Pack</h3>
    <p class="price">Rs 499</p>
    <button onclick="window.open('https://wa.me/923481689189')">Buy Now</button>
</div>

<div class="product">
    <img src="https://picsum.photos/500/300?2">
    <h3>Vlog Color LUTs</h3>
    <p class="price">Rs 699</p>
    <button onclick="window.open('https://wa.me/923481689189')">Buy Now</button>
</div>

<div class="product">
    <img src="https://picsum.photos/500/300?3">
    <h3>Cinematic Effects Pack</h3>
    <p class="price">Rs 999</p>
    <button onclick="window.open('https://wa.me/923481689189')">Buy Now</button>
</div>

<script>
const products = document.querySelectorAll('.product');

window.addEventListener('scroll', () => {
    products.forEach(p => {
        const top = p.getBoundingClientRect().top;
        if (top < window.innerHeight - 100) {
            p.classList.add('show');
        }
    });
});
</script>

</body>
</html>
