<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZENOTM SHOP</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #0f2027, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    overflow: hidden;
}

.container {
    text-align: center;
    animation: fadeIn 1.5s ease;
}

img {
    width: 260px;
    border-radius: 12px;
    box-shadow: 0 0 30px cyan;
    margin-bottom: 20px;
}

h1 {
    margin-bottom: 25px;
    letter-spacing: 2px;
}

button {
    padding: 15px 40px;
    font-size: 18px;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, #00fff0, #00aaff);
    color: black;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px cyan;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
    <img src="https://files.catbox.moe/4hhfet.png">
    <h1>WELCOME 🤗 TO ZENOTM SHOP</h1>
    <button onclick="location.href='shop.html'">Enter To Shop</button>
</div>

</body>
</html>
