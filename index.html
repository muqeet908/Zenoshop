<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZENOTM SHOP</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(-45deg, #000428, #004e92, #000000);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

@keyframes bg {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.container {
    text-align: center;
    animation: fadeIn 2s ease;
}

img {
    width: 320px;
    border-radius: 20px;
    box-shadow: 0 0 40px cyan;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0% {transform: translateY(0);}
    50% {transform: translateY(-15px);}
    100% {transform: translateY(0);}
}

h1 {
    color: white;
    margin-top: 20px;
    font-size: 28px;
}

button {
    margin-top: 25px;
    padding: 15px 40px;
    font-size: 18px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #00fff0, #00aaff);
    cursor: pointer;
    box-shadow: 0 0 20px cyan;
}

button:hover {
    transform: scale(1.1);
}
</style>
</head>

<body>

<div class="container">
    <img src="https://files.catbox.moe/4hhfet.png">
    <h1>✨ WELCOME TO ZENOTM SHOP ✨</h1>
    <button onclick="location.href='shop.html'">🚀 Enter Store</button>
</div>

</body>
</html>
