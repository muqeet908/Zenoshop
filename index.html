<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZENOTM SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    height: 100vh;
    background: linear-gradient(270deg,#001f3f,#001a33,#002b5c);
    background-size: 600% 600%;
    animation: bgMove 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: Arial, sans-serif;
    overflow:hidden;
}

@keyframes bgMove {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container {
    text-align:center;
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:scale(0.8);}
    to {opacity:1; transform:scale(1);}
}

.logo {
    width:260px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px cyan);
}

@keyframes float {
    0% {transform: translateY(0);}
    50% {transform: translateY(-20px);}
    100% {transform: translateY(0);}
}

h1 {
    color:#fff;
    margin:20px 0;
    text-shadow:0 0 15px cyan;
}

button {
    padding:16px 40px;
    font-size:18px;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg,#00ffff,#00aaff);
    color:black;
    font-weight:bold;
    box-shadow:0 0 25px cyan;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    transform:scale(1.1);
}
</style>
</head>

<body>

<div class="container">
    <img class="logo" src="https://files.catbox.moe/4hhfet.png">
    <h1>✨ WELCOME TO ZENOTM SHOP ✨</h1>
    <button onclick="location.href='shop.html'">🚀 Enter Store</button>
</div>

</body>
</html>
